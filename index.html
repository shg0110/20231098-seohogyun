<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>높이 쌓기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* layout: 화면 전체를 캔버스가 채우고, 위에는 층수, 아래에는 시작·결과 패널 */
:root {
  --ink: #ffffff;
  --ink-dim: rgba(255, 255, 255, 0.74);
  --night: #1b2131;
  --chip: rgba(255, 255, 255, 0.14);
  --chip-line: rgba(255, 255, 255, 0.32);
  --scrim: rgba(10, 12, 22, 0.62);
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: pointer; }
#cv { display: block; width: 100%; height: 100%; }

.hud {
  position: fixed; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 16px 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  pointer-events: none;
}
#score {
  font-family: var(--display);
  font-size: clamp(64px, 18vw, 104px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.14);
}
#combo {
  height: 22px;
  font-weight: 600; font-size: 15px; letter-spacing: 0.06em;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.25s, transform 0.25s;
}
#combo.on { opacity: 1; transform: none; }

.mute {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink);
  cursor: pointer; padding: 0;
}
.mute svg { width: 20px; height: 20px; }

.panel {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 120px 16px calc(env(safe-area-inset-bottom, 0px) + 52px);
  background: linear-gradient(to bottom, rgba(10, 12, 22, 0), var(--scrim) 45%);
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  text-align: center; pointer-events: none;
}
.panel h1 {
  margin: 0;
  font-family: var(--display); font-weight: 400;
  font-size: clamp(44px, 13vw, 68px); line-height: 1.05;
  text-wrap: balance;
}
.panel p { margin: 0; color: var(--ink-dim); font-size: 15px; line-height: 1.65; }
.tap { font-weight: 600; color: var(--ink); letter-spacing: 0.04em; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

.stats { display: flex; gap: 36px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; letter-spacing: 0.1em; color: var(--ink-dim); }
.badge {
  font-weight: 600; font-size: 13px; letter-spacing: 0.06em;
  padding: 5px 12px; border-radius: 999px;
  background: var(--ink); color: var(--night);
}
.btn {
  pointer-events: auto; cursor: pointer;
  font: 600 17px/1 var(--body);
  padding: 16px 30px; min-width: 190px;
  border: 0; border-radius: 999px;
  background: var(--ink); color: var(--night);
}
.btn:active { transform: scale(0.97); }
.btn:focus-visible, .mute:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .tap { animation: none; opacity: 1; }
  #combo { transition: none; }
}
</style>
</head>
<body>

<div id="stage"><canvas id="cv"></canvas></div>

<div class="hud">
  <div id="score" hidden>0</div>
  <div id="combo"></div>
</div>

<button class="mute" id="mute" type="button" aria-label="소리 끄기"></button>

<section class="panel" id="ready">
  <h1>높이 쌓기</h1>
  <p>움직이는 블록이 아래 블록과 겹칠 때 화면을 탭하세요.<br>삐져나온 부분은 잘려 나갑니다.<br>딱 맞게 세 번 이어 놓으면 블록이 다시 커집니다.</p>
  <p class="tap">탭해서 시작</p>
</section>

<section class="panel" id="over" hidden>
  <span class="badge" id="newbest" hidden>신기록</span>
  <div class="stats">
    <div class="stat"><b id="final">0</b><span>이번 기록 (층)</span></div>
    <div class="stat"><b id="best">0</b><span>최고 기록 (층)</span></div>
  </div>
  <button class="btn" id="again" type="button">다시 쌓기</button>
</section>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);

  // 월드 단위: 첫 블록 한 변 100, 한 층 높이 22
  const BASE = 100, LAYER = 22, RANGE = 150;
  const COS = Math.cos(Math.PI / 6), SIN = Math.sin(Math.PI / 6);

  let W = 0, H = 0, baseScale = 1;
  let scale = 1, camY = 0, cyFrac = 0.6;
  let state = 'ready';
  let stack = [], cur = null, debris = [], ripples = [];
  let combo = 0, hue0 = 0, overAt = 0, last = performance.now();

  const store = (k, v) => {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    } catch (e) { return null; }
  };
  let best = Number(store('stack.best')) || 0;
  let muted = store('stack.muted') === '1';

  // ---------- 소리 ----------
  let audio = null;
  function unlockAudio() {
    if (audio || muted) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  function tone(freq, dur, type, gain) {
    if (muted || !audio) return;
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function renderMute() {
    $('mute').innerHTML = muted ? ICON_OFF : ICON_ON;
    $('mute').setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
  }
  $('mute').addEventListener('click', () => {
    muted = !muted;
    store('stack.muted', muted ? '1' : '0');
    if (!muted) unlockAudio();
    renderMute();
  });
  renderMute();

  // ---------- 화면 ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 첫 블록의 화면 폭이 화면 폭의 55% (최대 290px)가 되도록
    baseScale = Math.min(W * 0.55, 290, H * 0.42) / (2 * BASE * COS);
    if (state !== 'over') scale = baseScale;
  }
  window.addEventListener('resize', resize);

  // ---------- 게임 ----------
  const top = () => stack[stack.length - 1];
  const floors = () => stack.length - 1;

  function newGame() {
    hue0 = Math.random() * 360;
    stack = [{ x: 0, z: 0, w: BASE, d: BASE, y0: -900, y1: LAYER, i: 0 }];
    cur = null; debris = []; ripples = []; combo = 0;
  }

  function spawn() {
    const p = top();
    const i = stack.length;
    const axis = i % 2 ? 'x' : 'z';
    cur = { x: p.x, z: p.z, w: p.w, d: p.d, y0: i * LAYER, y1: (i + 1) * LAYER, i, axis, dir: 1 };
    cur[axis] = -RANGE;
    cur.speed = Math.min(165 + i * 5, 470);
  }

  function showCombo(text) {
    const el = $('combo');
    el.textContent = text;
    el.classList.add('on');
    clearTimeout(showCombo.t);
    showCombo.t = setTimeout(() => el.classList.remove('on'), 700);
  }

  function place() {
    const p = top(), a = cur.axis, size = a === 'x' ? 'w' : 'd';
    const delta = cur[a] - p[a], miss = Math.abs(delta);

    // 딱 맞음 판정 폭: 블록이 빠를수록 조금 넓게 (6~9)
    const perfect = Math.min(9, Math.max(6, cur.speed * 0.02));
    if (miss <= perfect) {
      cur[a] = p[a];
      combo++;
      if (combo >= 3) {
        cur.w = Math.min(cur.w + 6, BASE);
        cur.d = Math.min(cur.d + 6, BASE);
      }
      ripples.push({ x: cur.x, z: cur.z, w: cur.w, d: cur.d, y: cur.y1, t: 0 });
      tone(392 * Math.pow(2, Math.min(combo - 1, 12) / 12), 0.22, 'sine', 0.16);
      showCombo(combo >= 2 ? `딱 맞음 ×${combo}` : '딱 맞음');
      if (navigator.vibrate) navigator.vibrate(12);
    } else {
      const overlap = p[size] - miss;
      if (overlap <= 0) {
        drop({ ...cur }, Math.sign(delta));
        cur = null;
        tone(110, 0.4, 'triangle', 0.18);
        gameOver();
        return;
      }
      const piece = { ...cur };
      piece[size] = miss;
      piece[a] = p[a] + Math.sign(delta) * (p[size] / 2 + miss / 2);
      drop(piece, Math.sign(delta));
      cur[size] = overlap;
      cur[a] = p[a] + delta / 2;
      combo = 0;
      tone(196, 0.12, 'triangle', 0.14);
    }

    delete cur.axis; delete cur.dir; delete cur.speed;
    stack.push(cur);
    $('score').textContent = floors();
    spawn();
  }

  function drop(piece, sign) {
    piece.vy = 0;
    piece.v = sign * 50;
    piece.moveAxis = cur.axis;
    debris.push(piece);
  }

  function start() {
    newGame();
    state = 'play';
    $('ready').hidden = true; $('over').hidden = true;
    $('score').hidden = false; $('score').textContent = '0';
    spawn();
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    const n = floors();
    const isBest = n > best;
    if (isBest) { best = n; store('stack.best', String(best)); }
    $('final').textContent = n;
    $('best').textContent = best;
    $('newbest').hidden = !isBest;
    $('score').hidden = true;
    $('over').hidden = false;
  }

  function act() {
    unlockAudio();
    if (state === 'ready') start();
    else if (state === 'play' && cur) place();
    else if (state === 'over' && performance.now() - overAt > 700) start();
  }

  $('stage').addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    e.preventDefault();
    act();
  });
  $('again').addEventListener('click', () => { unlockAudio(); start(); });
  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    e.preventDefault();
    if (!e.repeat) act();
  });

  // ---------- 업데이트 ----------
  function update(dt) {
    if (state === 'play' && cur) {
      const a = cur.axis;
      cur[a] += cur.dir * cur.speed * dt;
      if (cur[a] > RANGE) { cur[a] = RANGE; cur.dir = -1; }
      if (cur[a] < -RANGE) { cur[a] = -RANGE; cur.dir = 1; }
    }

    for (const b of debris) {
      b.vy -= 1100 * dt;
      b.y0 += b.vy * dt; b.y1 += b.vy * dt;
      b[b.moveAxis] += b.v * dt;
    }
    debris = debris.filter((b) => b.y1 > camY - 1400);

    for (const r of ripples) r.t += dt;
    ripples = ripples.filter((r) => r.t < 0.6);

    // 카메라
    const towerTop = top().y1;
    let tCam, tScale, tCy;
    if (state === 'over') {
      tCam = towerTop * 0.5;
      tScale = Math.min(baseScale, (H * 0.44 - 60) / (towerTop * 0.5 + 70));
      tCy = 0.4;
    } else {
      tCam = towerTop;
      tScale = baseScale;
      tCy = 0.6;
    }
    const k = Math.min(1, dt * 5);
    camY += (tCam - camY) * k;
    scale += (tScale - scale) * k;
    cyFrac += (tCy - cyFrac) * k;
  }

  // ---------- 그리기 ----------
  let cx = 0, cy = 0;
  const px = (x, z) => cx + (x - z) * COS * scale;
  const py = (x, y, z) => cy + ((x + z) * SIN - (y - camY)) * scale;

  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let j = 2; j < pts.length; j += 2) ctx.lineTo(pts[j], pts[j + 1]);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function box(b, alpha) {
    const x0 = b.x - b.w / 2, x1 = b.x + b.w / 2;
    const z0 = b.z - b.d / 2, z1 = b.z + b.d / 2;
    // 화면 밖이면 건너뛰기
    const topY = py(b.x, b.y1, b.z) - BASE * scale;
    const botY = py(x1, b.y0, z1);
    if (topY > H || botY < 0) return;

    const hue = (hue0 + b.i * 7) % 360;
    ctx.globalAlpha = alpha;
    // 오른쪽 면 (x = x1)
    poly([px(x1, z0), py(x1, b.y1, z0), px(x1, z1), py(x1, b.y1, z1),
          px(x1, z1), py(x1, b.y0, z1), px(x1, z0), py(x1, b.y0, z0)],
         `hsl(${hue} 52% 47%)`);
    // 앞쪽 면 (z = z1)
    poly([px(x0, z1), py(x0, b.y1, z1), px(x1, z1), py(x1, b.y1, z1),
          px(x1, z1), py(x1, b.y0, z1), px(x0, z1), py(x0, b.y0, z1)],
         `hsl(${hue} 50% 37%)`);
    // 윗면
    poly([px(x0, z0), py(x0, b.y1, z0), px(x1, z0), py(x1, b.y1, z0),
          px(x1, z1), py(x1, b.y1, z1), px(x0, z1), py(x0, b.y1, z1)],
         `hsl(${hue} 64% 64%)`);
    ctx.globalAlpha = 1;
  }

  function ripple(r) {
    const p = r.t / 0.6, e = 4 + p * 46;
    const x0 = r.x - r.w / 2 - e, x1 = r.x + r.w / 2 + e;
    const z0 = r.z - r.d / 2 - e, z1 = r.z + r.d / 2 + e;
    ctx.beginPath();
    ctx.moveTo(px(x0, z0), py(x0, r.y, z0));
    ctx.lineTo(px(x1, z0), py(x1, r.y, z0));
    ctx.lineTo(px(x1, z1), py(x1, r.y, z1));
    ctx.lineTo(px(x0, z1), py(x0, r.y, z1));
    ctx.closePath();
    ctx.strokeStyle = `rgba(255,255,255,${(1 - p) * 0.85})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  function draw() {
    const n = stack.length;
    const h = (hue0 + n * 7 + 40) % 360;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${h} 32% 40%)`);
    g.addColorStop(1, `hsl(${(h + 35) % 360} 36% 17%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    cx = W / 2; cy = H * cyFrac;
    // 탑 뒤쪽(음수 방향)으로 떨어지는 조각은 탑보다 먼저 그린다
    for (const b of debris) if (b.v < 0) box(b, 1);
    for (const b of stack) box(b, 1);
    for (const b of debris) if (b.v >= 0) box(b, 1);
    for (const r of ripples) ripple(r);
    if (cur) box(cur, 1);
  }

  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  newGame();
  $('best').textContent = best;
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
